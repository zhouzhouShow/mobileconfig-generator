name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run selfcheck
        run: python tests/selfcheck.py

      - name: Build exe
        run: python build.py

      - name: Rename release asset
        shell: pwsh
        run: |
          # GitHub 会丢弃非 ASCII 资产名（中文名会变成 Apple.exe），发布时统一用英文名
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          Move-Item $exe.FullName "dist/AppleProfileTool.exe" -Force
          Get-ChildItem dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AppleProfileTool.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
